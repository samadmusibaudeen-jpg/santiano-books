<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password — ENT Books</title>
<meta name="description" content="Choose a new password for your ENT Books account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ENT Books — shared theme (home, book, library, account) */
:root {
  --bg: #f5efe4; --surface: #fffdf8; --ink: #1b1813; --muted: #6f675a; --line: #e3d9c6;
  --brand: #1f4d3a; --brand-ink: #fffdf8; --accent: #e0643a; --soft: #ece3d1;
  --nav-bg: rgba(245, 239, 228, .94); --danger: #b42318; --hh: 64px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100d; --surface: #1b1814; --ink: #f4eee2; --muted: #a39a89; --line: #2e2921;
    --brand: #7fd1a6; --brand-ink: #10231a; --accent: #ff8a5c; --soft: #241f19;
    --nav-bg: rgba(18, 16, 13, .94); --danger: #f97066; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100d; --surface: #1b1814; --ink: #f4eee2; --muted: #a39a89; --line: #2e2921;
  --brand: #7fd1a6; --brand-ink: #10231a; --accent: #ff8a5c; --soft: #241f19;
  --nav-bg: rgba(18, 16, 13, .94); --danger: #f97066; color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--hh) + 16px); }
body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; font-size: 16px; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.08; letter-spacing: -.02em; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { width: min(1180px, 92%); margin-inline: auto; }
.muted { color: var(--muted); }
svg.i { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* header */
header.site { position: sticky; top: 0; z-index: 50; padding-top: env(safe-area-inset-top, 0px); background: var(--nav-bg); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 2px solid var(--ink); }
.nav { height: var(--hh); display: flex; align-items: center; gap: 20px; }
.logo { display: inline-flex; align-items: center; gap: 10px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.03em; }
.logo i { width: 34px; height: 34px; display: grid; place-items: center; background: var(--accent); color: #fff; border: 2px solid var(--ink); border-radius: 50%; font-style: normal; font-size: 16px; }
.links { display: flex; gap: 6px; margin-left: auto; }
.links a { padding: 8px 16px; border-radius: 99px; font-size: 14px; font-weight: 500; transition: .2s; }
.links a:hover { background: var(--soft); }
.links a.active { background: var(--ink); color: var(--bg); }
.actions { display: flex; align-items: center; gap: 10px; }
.cart-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border: 2px solid var(--ink); border-radius: 50%; background: var(--surface); transition: .2s; }
.cart-btn:hover { background: var(--accent); color: #fff; }
sup[data-cart-count] { position: absolute; top: -7px; right: -7px; display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px; border: 2px solid var(--bg); border-radius: 99px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700; line-height: 1; }
.acct { display: inline-flex; align-items: center; height: 42px; padding: 0 20px; border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: 14px; font-weight: 700; transition: .2s; }
.acct:hover { filter: brightness(1.15); }
.burger { display: none; width: 42px; height: 42px; border: 2px solid var(--ink); border-radius: 50%; background: var(--surface); font-size: 18px; cursor: pointer; }
.mm { display: none; padding: 8px 4% 18px; background: var(--surface); border-bottom: 2px solid var(--ink); }
.mm.open { display: grid; }
.mm a { padding: 14px 4px; border-bottom: 1px solid var(--line); font-size: 16px; font-weight: 500; }
.mm a.out { color: var(--danger); border-bottom: 0; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 26px; border: 2px solid var(--ink); border-radius: 99px; font-size: 15px; font-weight: 700; cursor: pointer; transition: .2s; }
.btn-p { background: var(--brand); color: var(--brand-ink); box-shadow: 4px 4px 0 var(--ink); }
.btn-p:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn-o { background: var(--surface); color: var(--ink); }
.btn-o:hover { background: var(--accent); color: #fff; }

/* page head */
.tag-label { display: inline-block; padding: 5px 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-2deg); }
.page-head { padding: 48px 0 28px; }
.page-head .wrap { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.page-head h1 { margin-top: 18px; font-size: clamp(40px, 7vw, 84px); font-weight: 800; }
.page-head h1 em { font-style: normal; color: var(--accent); }
.page-head .lead { margin-top: 14px; max-width: 480px; color: var(--muted); font-size: 17px; }
.page-head .lead strong { color: var(--ink); }

/* panels / feats / section head */
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); }
.feats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.feat { padding: 22px; background: var(--surface); border: 2px solid var(--ink); border-radius: 18px; }
.feat svg { width: 26px; height: 26px; color: var(--accent); }
.feat b { display: block; margin-top: 10px; font-size: 16px; font-weight: 700; }
.feat span { font-size: 14px; color: var(--muted); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 26px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.head h2 { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; }
.head .btn { min-height: 42px; padding: 0 18px; white-space: nowrap; font-size: 14px; }

/* books */
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 28px 22px; }
.books-grid > p { grid-column: 1 / -1; padding: 48px 20px; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 20px; }
.book-card { position: relative; display: flex; flex-direction: column; padding: 12px; background: var(--surface); border: 2px solid var(--ink); border-radius: 20px; box-shadow: 5px 5px 0 var(--ink); transition: transform .2s, box-shadow .2s; }
.book-card:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--accent); }
.book-card .cover, .book-card .book-cover { width: 100%; height: 270px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 2px solid var(--ink); border-radius: 12px; background: var(--soft); color: var(--muted); font-size: 13px; text-align: center; }
.book-card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 10px; }
.book-card .cover img, .book-card .book-cover img { height: 100%; aspect-ratio: auto; border-radius: 0; transition: transform .4s; }
.book-card:hover .cover img, .book-card:hover .book-cover img { transform: scale(1.05); }
.book-card h3 { margin-top: 14px; font-size: 18px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; }
.book-card h3 a:hover { color: var(--accent); }
.book-card p, .book-card span, .book-card small { color: var(--muted); font-size: 14px; }
.book-card .price, .book-card .book-price, .book-card strong { color: var(--ink); font-size: 17px; font-weight: 700; }
.book-card .category, .book-card .badge, .book-card .tag { display: inline-block; width: fit-content; margin-top: 10px; padding: 2px 10px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--soft); color: var(--ink); font-size: 11px; font-weight: 700; }
.book-card a.btn, .book-card .gold-btn, .book-card button { display: inline-flex; align-items: center; justify-content: center; width: 100%; min-height: 44px; margin-top: auto; padding: 0 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--brand); color: var(--brand-ink); font-size: 14px; font-weight: 700; box-shadow: none; cursor: pointer; transition: .2s; }
.book-card h3 + *, .book-card p + a.btn, .book-card p + .gold-btn, .book-card p + button { margin-top: 10px; }
.book-card a.btn:hover, .book-card .gold-btn:hover, .book-card button:hover { background: var(--accent); color: #fff; transform: none; }

/* footer */
.ft { padding: 56px 0 28px; background: var(--ink); color: var(--bg); }
.fg { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: 36px; padding-bottom: 36px; }
.ft .logo i { border-color: var(--bg); }
.fg p { max-width: 290px; margin-top: 14px; font-size: 14px; opacity: .7; }
.fg h4 { margin-bottom: 14px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.fg nav { display: grid; gap: 10px; }
.fg nav a { width: fit-content; font-size: 14px; opacity: .75; }
.fg nav a:hover { opacity: 1; }
.fb { padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, .15); font-size: 13px; opacity: .6; }

/* responsive */
@media (max-width: 960px) {
  .feats { grid-template-columns: repeat(2, 1fr); }
  .fg { grid-template-columns: 1fr 1fr; }
  .fg > div:first-child { grid-column: 1 / -1; }
}
@media (max-width: 800px) {
  :root { --hh: 60px; }
  .links, .acct { display: none; }
  .burger { display: block; }
  .actions { margin-left: auto; } /* cart stays visible on mobile */
  .nav { gap: 10px; }
}
@media (max-width: 600px) {
  .feats { grid-template-columns: 1fr; }
  .books-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .book-card { padding: 8px; border-radius: 16px; box-shadow: 3px 3px 0 var(--ink); }
  .book-card .cover, .book-card .book-cover { height: 190px; }
  .book-card h3 { font-size: 15px; }
  .head { flex-direction: column; align-items: flex-start; }
  .fg { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ---------- auth pages ---------- */
.page { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.side { position: relative; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; overflow: hidden; background: var(--brand); color: var(--brand-ink); border-right: 2px solid var(--ink); }
.side::after { content: "ENT"; position: absolute; right: -20px; bottom: -80px; font: 800 340px/1 "Bricolage Grotesque", sans-serif; color: rgba(255, 255, 255, .08); pointer-events: none; }
.side .logo i { border-color: var(--brand-ink); }
.side blockquote { position: relative; z-index: 1; max-width: 420px; }
.side blockquote p { font: 800 clamp(28px, 3.2vw, 42px)/1.15 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
.side cite { display: inline-block; margin-top: 20px; padding: 5px 14px; border: 2px solid var(--ink); border-radius: 99px; background: var(--accent); color: #fff; font-style: normal; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; transform: rotate(-2deg); }
.side small { position: relative; z-index: 1; font-size: 13px; opacity: .7; }
.side ul { position: relative; z-index: 1; list-style: none; display: grid; gap: 22px; max-width: 400px; }
.side li { display: flex; gap: 14px; font-size: 15px; opacity: .92; }
.side li b { display: block; margin-bottom: 2px; font: 800 24px "Bricolage Grotesque", sans-serif; }
.side li .n { flex-shrink: 0; width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; }

.main { display: flex; flex-direction: column; padding: 28px 48px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.top a { color: var(--ink); font-weight: 700; }
.top a:hover { color: var(--accent); }
.box { flex: 1; display: grid; place-items: center; }
.card { width: 100%; max-width: 420px; padding: 12px 0; }
.card h1 { margin-top: 18px; font-size: clamp(34px, 5vw, 48px); font-weight: 800; }
.card h1 em { font-style: normal; color: var(--accent); }
.sub { margin-top: 12px; color: var(--muted); font-size: 15px; }

form { margin-top: 28px; display: grid; gap: 18px; }
label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
.field { position: relative; }
input[type=email], input[type=password], input[type=text] { width: 100%; height: 54px; padding: 0 20px; border: 2px solid var(--ink); border-radius: 99px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; transition: .2s; }
input[type=email]:focus, input[type=password]:focus, input[type=text]:focus { outline: 0; box-shadow: 4px 4px 0 var(--accent); }
input.bad { border-color: var(--danger); }
input::placeholder { color: var(--muted); opacity: .75; }
.pw input { padding-right: 84px; }
.show { position: absolute; right: 8px; top: 9px; height: 36px; padding: 0 14px; border: 0; border-radius: 99px; background: var(--soft); color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.show:hover { background: var(--accent); color: #fff; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
.row a { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--accent); }
.check { display: flex; align-items: flex-start; gap: 10px; margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; }
.check input { margin-top: 3px; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--brand); }
.check a { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--accent); }

.bar { display: flex; gap: 5px; margin-top: 10px; }
.bar i { flex: 1; height: 6px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--surface); transition: .2s; }
.hint { margin-top: 6px; font-size: 12px; color: var(--muted); }

.msg-line { min-height: 20px; text-align: center; font-size: 14px; color: var(--muted); }
.submit { width: 100%; height: 56px; border: 2px solid var(--ink); border-radius: 99px; background: var(--brand); color: var(--brand-ink); font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .04em; cursor: pointer; box-shadow: 4px 4px 0 var(--ink); transition: .2s; }
.submit:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.submit:disabled { opacity: .6; cursor: default; transform: none; box-shadow: 4px 4px 0 var(--ink); }
.alt { margin-top: 26px; text-align: center; font-size: 14px; color: var(--muted); }
.alt a { color: var(--ink); font-weight: 700; border-bottom: 2px solid var(--accent); }

@media (max-width: 860px) {
  .page { grid-template-columns: 1fr; }
  .side { padding: 26px 22px; gap: 24px; border-right: 0; border-bottom: 2px solid var(--ink); }
  .side blockquote p { font-size: 24px; }
  .side ul, .side small, .side::after { display: none; }
  .main { padding: 22px; }
  .box { place-items: start center; padding-top: 22px; }
}
@media (max-width: 420px) { .row { flex-direction: column; align-items: flex-start; } }

</style>
</head>
<body>
<div class="page">

<aside class="side">
<a href="/" class="logo"><i>E</i>ENT Books</a>
<blockquote>
<p>“A fresh start is just one new password away.”</p>
<cite>Enlighten · Nurture · Transform</cite>
</blockquote>
<small>© 2026 ENT Books. All rights reserved.</small>
</aside>

<main class="main">
<div class="top">
<a href="login">← Back to login</a>
<span>Need a new link? <a href="forgot-password">Request one</a></span>
</div>
<div class="box">
<div class="card">
<span class="tag-label">Account security</span>
<h1>Reset your <em>password</em></h1>
<p class="sub">Choose a new password for your ENT Books account.</p>

<form id="resetPasswordForm">
<div>
<label for="newPassword">New password</label>
<div class="field pw">
<input id="newPassword" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
<button type="button" class="show" onclick="togglePassword('newPassword', this)" aria-label="Show password">Show</button>
</div>
</div>
<div>
<label for="confirmNewPassword">Confirm new password</label>
<div class="field pw">
<input id="confirmNewPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
<button type="button" class="show" onclick="togglePassword('confirmNewPassword', this)" aria-label="Show password">Show</button>
</div>
</div>
<p id="resetPasswordMessage" class="msg-line" role="status" aria-live="polite"></p>
<button class="submit" type="submit" id="resetPasswordButton">RESET PASSWORD</button>
</form>

<p class="alt">Remembered it? <a href="login">Log in</a></p>
</div>
</div>
</main>

</div>

<script src="js/auth.js"></script>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }

    const resetForm = document.getElementById("resetPasswordForm");
    const resetButton = document.getElementById("resetPasswordButton");
    const resetMessage = document.getElementById("resetPasswordMessage");

    const resetToken = new URLSearchParams(window.location.search).get("token");

    if (!resetToken) {
        resetMessage.textContent = "This reset link is missing its token. Please request a new one.";
        resetButton.disabled = true;
    }

    resetForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmNewPassword").value;

        resetMessage.textContent = "";

        if (!resetToken) {
            resetMessage.textContent = "Please request a new password reset link.";
            return;
        }

        if (password.length < 8) {
            resetMessage.textContent = "Your password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmation) {
            resetMessage.textContent = "The passwords do not match.";
            return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "RESETTING...";

        try {
            const result = await resetUserPassword(resetToken, password);

            resetMessage.textContent = result.message || "Your password has been reset successfully.";
            resetForm.reset();

            setTimeout(function () {
                window.location.href = "login";
            }, 1800);

        } catch (error) {
            resetMessage.textContent = error.message || "Unable to reset your password. Please request a new link.";
            resetButton.disabled = false;
            resetButton.textContent = "RESET PASSWORD";
        }
    });
</script>
</body>
</html>
