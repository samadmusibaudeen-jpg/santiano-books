```html
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Reset Password — Santiano Books</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .password-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .password-wrapper input {
      flex: 1;
      min-width: 0;
    }

    .password-wrapper button {
      padding: 10px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: transparent;
    }

    .reset-message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .reset-help {
      margin-top: 18px;
      text-align: center;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a class="logo" href="index.html">SANTIANO BOOKS</a>
      <a href="login.html">Back to Login</a>
    </div>
  </nav>

  <main class="page">
    <div class="form-wrap">
      <div class="eyebrow">SANTIANO BOOKS</div>

      <h3>Reset Your Password</h3>

      <p>Choose a new password for your Santiano Books account.</p>

      <form id="resetPasswordForm">
        <div class="field">
          <label for="newPassword">NEW PASSWORD</label>

          <div class="password-wrapper">
            <input
              id="newPassword"
              type="password"
              placeholder="At least 8 characters"
              minlength="8"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              onclick="togglePassword('newPassword', this)"
              aria-label="Show or hide new password"
            >👁️</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmNewPassword">CONFIRM NEW PASSWORD</label>

          <div class="password-wrapper">
            <input
              id="confirmNewPassword"
              type="password"
              placeholder="Enter your password again"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              onclick="togglePassword('confirmNewPassword', this)"
              aria-label="Show or hide password confirmation"
            >👁️</button>
          </div>
        </div>

        <button
          type="submit"
          id="resetPasswordButton"
        >RESET PASSWORD</button>
      </form>

      <p
        id="resetPasswordMessage"
        class="reset-message"
        role="status"
        aria-live="polite"
      ></p>

      <div class="reset-help">
        <a href="forgot-password.html">Request another reset link</a>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>

  <script>
    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "🙈";
      } else {
        input.type = "password";
        button.textContent = "👁️";
      }
    }

    const resetForm = document.getElementById("resetPasswordForm");
    const resetButton = document.getElementById("resetPasswordButton");
    const resetMessage = document.getElementById("resetPasswordMessage");

    const resetToken = new URLSearchParams(
      window.location.search
    ).get("token");

    if (!resetToken) {
      resetMessage.textContent =
        "This reset link is missing its token. Please request a new one.";
      resetButton.disabled = true;
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirmation =
        document.getElementById("confirmNewPassword").value;

      resetMessage.textContent = "";

      if (!resetToken) {
        resetMessage.textContent =
          "Please request a new password reset link.";
        return;
      }

      if (password.length < 8) {
        resetMessage.textContent =
          "Your password must contain at least 8 characters.";
        return;
      }

      if (password !== confirmation) {
        resetMessage.textContent =
          "The passwords do not match.";
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "RESETTING...";

      try {
        const result = await resetUserPassword(resetToken, password);

        resetMessage.textContent =
          result.message || "Your password has been reset successfully.";

        resetForm.reset();

        setTimeout(function () {
          window.location.href = "login.html";
        }, 1800);

      } catch (error) {
        resetMessage.textContent =
          error.message || "Unable to reset your password. Please request a new link.";

        resetButton.disabled = false;
        resetButton.textContent = "RESET PASSWORD";
      }
    });
  </script>
</body>
</html>
```
