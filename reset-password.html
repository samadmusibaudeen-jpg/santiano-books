<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reset Password — ENT Books</title>
<meta name="description" content="Choose a new password for your ENT Books account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fb;--surface:#fff;--ink:#0b1324;--muted:#5d6678;--line:#dfe3ea;--brand:#12295c;--brand-ink:#fff;--accent:#a9792b;--err:#b42318;--ok:#067647;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1c;--surface:#111827;--ink:#eef1f7;--muted:#9aa3b5;--line:#243049;--brand:#8aa4ff;--brand-ink:#0a0f1c;--accent:#d9b068;--err:#f97066;--ok:#47cd89;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1c;--surface:#111827;--ink:#eef1f7;--muted:#9aa3b5;--line:#243049;--brand:#8aa4ff;--brand-ink:#0a0f1c;--accent:#d9b068;--err:#f97066;--ok:#47cd89;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.side{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:48px;background:linear-gradient(150deg,#1b3a7d,#0a1633);color:#fff;overflow:hidden}
.side::after{content:"ENT";position:absolute;right:-20px;bottom:-90px;font-family:"Source Serif 4",Georgia,serif;font-size:340px;font-weight:600;line-height:1;color:rgba(255,255,255,.04);pointer-events:none}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:19px}
.logo i{width:32px;height:32px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.5);border-radius:7px;font-style:normal;font-size:17px}
.side blockquote{position:relative;z-index:1;max-width:420px}
.side blockquote p{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(24px,2.6vw,32px);font-style:italic;line-height:1.35}
.side cite{display:block;margin-top:18px;font-style:normal;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e3c585}
.side small{position:relative;z-index:1;font-size:13px;color:rgba(255,255,255,.65)}
.main{display:flex;flex-direction:column;padding:32px 48px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.top a:hover{color:var(--ink)}
.box{flex:1;display:grid;place-items:center}
.card{width:100%;max-width:400px;padding:12px 0}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.card h1{margin-top:16px;font-size:34px}
.sub{margin-top:10px;color:var(--muted);font-size:15px}
form{margin-top:32px;display:grid;gap:20px}
label{display:block;margin-bottom:7px;font-size:13px;font-weight:500}
.field{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;transition:.2s}
input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
input.bad{border-color:var(--err)}
.pw input{padding-right:64px}
.show{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.show:hover{color:var(--ink)}
.err{display:none;margin-top:6px;font-size:13px;color:var(--err)}
.err.on{display:block}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.check{display:flex;align-items:center;gap:9px;color:var(--muted);cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--brand)}
.row a{color:var(--brand);font-weight:500}
.row a:hover{text-decoration:underline}
.btn{width:100%;height:48px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.6;cursor:default}
.msg{display:none;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.msg.on{display:block}
.msg.ok{color:var(--ok)}
.msg.no{color:var(--err)}
.msg-line{min-height:20px;text-align:center;font-size:14px;color:var(--muted)}
.alt{margin-top:28px;text-align:center;font-size:14px;color:var(--muted)}
.alt a{color:var(--brand);font-weight:500}
.alt a:hover{text-decoration:underline}
@media (max-width:860px){
.page{grid-template-columns:1fr}
.side{padding:28px 24px;min-height:0;gap:28px}
.side blockquote p{font-size:22px}
.side small,.side::after{display:none}
.main{padding:24px}
.box{place-items:start center;padding-top:24px}
}
@media (max-width:420px){.card h1{font-size:30px}.row{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="page">
<aside class="side">
<a href="index.html" class="logo"><i>E</i>ENT Books</a>
<blockquote>
<p>“A fresh start is just one new password away.”</p>
<cite>Enlighten · Nurture · Transform</cite>
</blockquote>
<small>© 2026 ENT Books. All rights reserved.</small>
</aside>

<main class="main">
<div class="top">
<a href="login.html">← Back to login</a>
<span>Need a new link? <a href="forgot-password.html" style="color:var(--brand);font-weight:500">Request one</a></span>
</div>
<div class="box">
<div class="card">
<span class="eyebrow">Account security</span>
<h1>Reset your password</h1>
<p class="sub">Choose a new password for your ENT Books account.</p>

<form id="resetPasswordForm">
<div>
<label for="newPassword">New password</label>
<div class="field pw">
<input id="newPassword" type="password" placeholder="At least 8 characters" minlength="8" autocomplete="new-password" required>
<button type="button" class="show" onclick="togglePassword('newPassword', this)" aria-label="Show password">Show</button>
</div>
</div>
<div>
<label for="confirmNewPassword">Confirm new password</label>
<div class="field pw">
<input id="confirmNewPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
<button type="button" class="show" onclick="togglePassword('confirmNewPassword', this)" aria-label="Show password">Show</button>
</div>
</div>
<p id="resetPasswordMessage" class="msg-line" role="status" aria-live="polite"></p>
<button class="btn" type="submit" id="resetPasswordButton">RESET PASSWORD</button>
</form>

<p class="alt">Remembered it? <a href="login.html">Log in</a></p>
</div>
</div>
</main>
</div>

<script src="js/auth.js"></script>
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
    }

    const resetForm = document.getElementById("resetPasswordForm");
    const resetButton = document.getElementById("resetPasswordButton");
    const resetMessage = document.getElementById("resetPasswordMessage");

    const resetToken = new URLSearchParams(window.location.search).get("token");

    if (!resetToken) {
        resetMessage.textContent = "This reset link is missing its token. Please request a new one.";
        resetButton.disabled = true;
    }

    resetForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmNewPassword").value;

        resetMessage.textContent = "";

        if (!resetToken) {
            resetMessage.textContent = "Please request a new password reset link.";
            return;
        }

        if (password.length < 8) {
            resetMessage.textContent = "Your password must contain at least 8 characters.";
            return;
        }

        if (password !== confirmation) {
            resetMessage.textContent = "The passwords do not match.";
            return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "RESETTING...";

        try {
            const result = await resetUserPassword(resetToken, password);

            resetMessage.textContent = result.message || "Your password has been reset successfully.";
            resetForm.reset();

            setTimeout(function () {
                window.location.href = "login.html";
            }, 1800);

        } catch (error) {
            resetMessage.textContent = error.message || "Unable to reset your password. Please request a new link.";
            resetButton.disabled = false;
            resetButton.textContent = "RESET PASSWORD";
        }
    });
</script>
</body>
</html>
