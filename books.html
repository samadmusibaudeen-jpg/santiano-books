<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Books — Santiano Books</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >


  <style>

    :root {
      --books-bg: #faf6f0;
      --books-paper: #ffffff;
      --books-cream: #f5efe6;
      --books-line: #ebe4d9;
      --books-text: #1e1a16;
      --books-muted: #6b645c;
      --books-gold: #b8893d;
      --books-dark: #2c3e6b;
    }


    body {
      background:
        var(--books-bg);
    }


    /* =========================
       SIDEBAR
    ========================= */

    .books-sidebar {

      position: fixed;

      top: 0;
      left: 0;

      width: 260px;
      height: 100vh;

      padding: 28px 18px;

      background:
        var(--books-paper);

      border-right:
        1px solid var(--books-line);

      box-shadow:
        4px 0 24px
        rgba(40, 30, 15, .04);

      z-index: 1000;

      overflow-y: auto;

      transform:
        translateX(-100%);

      transition:
        transform .3s ease;
    }


    .books-sidebar.open {
      transform:
        translateX(0);
    }


    .books-sidebar-title {

      display: block;

      margin-bottom: 14px;

      padding-bottom: 12px;

      border-bottom:
        1px solid var(--books-line);

      color:
        var(--books-text);

      font-size: 12px;

      letter-spacing:
        1.5px;
    }


    .books-sidebar a {

      display: flex;

      align-items: center;

      gap: 10px;

      margin: 3px 0;

      padding: 12px;

      border-radius: 10px;

      color:
        var(--books-muted);

      font-size: 14px;

      text-decoration: none;

      transition:
        background .2s,
        color .2s;
    }


    .books-sidebar a:hover {

      background:
        var(--books-cream);

      color:
        var(--books-text);
    }


    .books-sidebar a.active {

      background:
        var(--books-cream);

      color:
        var(--books-gold);

      font-weight: 700;
    }


    .books-sidebar a.books-sidebar-logout {

      margin-top: 10px;

      border-top:
        1px solid var(--books-line);

      border-radius:
        0 0 10px 10px;

      color:
        #9a5d4a;
    }


    .books-sidebar a.books-sidebar-logout:hover {

      background:
        #fff3ef;
    }


    /* =========================
       CATEGORIES (sidebar)
    ========================= */

    .categories-section {

      margin-top: 28px;
    }


    /*
     * app.js fills this container
     * dynamically from the books API.
     */

    #categoriesList {

      display: flex;

      flex-direction: column;

      gap: 0;
    }


    .categories-loading {

      padding: 10px 12px;

      color:
        var(--books-muted);

      font-size: 13px;
    }


    .categories-empty {

      padding: 10px 12px;

      color:
        var(--books-muted);

      font-size: 13px;

      line-height: 1.5;
    }


    /* =========================
       MOBILE CATEGORIES (horizontal)
    ========================= */

    .mobile-categories {

      display: none;

      background:
        var(--books-paper);

      border-bottom:
        1px solid var(--books-line);

      padding:
        12px 0 14px;

      position: sticky;

      top: 57px; /* below mobile header */

      z-index: 850;
    }


    .mobile-categories-inner {

      display: flex;

      align-items: center;

      gap: 8px;

      overflow-x: auto;

      -webkit-overflow-scrolling: touch;

      scrollbar-width: none; /* Firefox */

      padding:
        0 16px;
    }


    .mobile-categories-inner::-webkit-scrollbar {
      display: none;
    }


    .mobile-categories-label {

      flex-shrink: 0;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 1.2px;

      color:
        var(--books-muted);

      text-transform: uppercase;

      padding-right: 4px;
    }


    #mobileCategoriesList {

      display: flex;

      align-items: center;

      gap: 8px;

      flex: 1;
      min-width: 0;
    }


    #mobileCategoriesList a {

      flex-shrink: 0;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      padding:
        8px 14px;

      border-radius: 999px;

      border:
        1px solid var(--books-line);

      background:
        var(--books-cream);

      color:
        var(--books-text);

      font-size: 13px;

      font-weight: 500;

      text-decoration: none;

      white-space: nowrap;

      transition:
        background .2s,
        border-color .2s,
        color .2s;
    }


    #mobileCategoriesList a:hover,
    #mobileCategoriesList a:focus {

      background:
        #efe6d8;

      border-color:
        #d9cfc0;
    }


    #mobileCategoriesList a.active {

      background:
        var(--books-dark);

      border-color:
        var(--books-dark);

      color: #fff;

      font-weight: 600;
    }


    #mobileCategoriesList .categories-loading,
    #mobileCategoriesList .categories-empty {

      padding: 8px 4px;

      font-size: 13px;

      color:
        var(--books-muted);

      white-space: nowrap;
    }


    /* =========================
       OVERLAY
    ========================= */

    .books-overlay {

      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(30, 26, 22, .45);

      z-index: 999;
    }


    .books-overlay.show {
      display: block;
    }


    /* =========================
       MOBILE HEADER
    ========================= */

    .books-mobile-header {

      display: none;

      align-items: center;

      gap: 14px;

      padding:
        14px 16px;

      background:
        var(--books-paper);

      border-bottom:
        1px solid var(--books-line);

      position: sticky;

      top: 0;

      z-index: 900;
    }


    .books-hamburger {

      background: none;

      border:
        1px solid var(--books-line);

      border-radius: 9px;

      width: 40px;
      height: 40px;

      display: grid;

      place-items: center;

      font-size: 20px;

      color:
        var(--books-dark);

      cursor: pointer;

      transition:
        background .2s;
    }


    .books-hamburger:hover {

      background:
        var(--books-cream);
    }


    .books-mobile-header h1 {

      margin: 0;

      font-size: 17px;

      font-weight: 700;

      color:
        var(--books-text);
    }


    /* =========================
       TOOLBAR
    ========================= */

    .books-toolbar {

      display: flex;

      justify-content:
        space-between;

      align-items: center;

      gap: 20px;

      margin-bottom: 30px;

      flex-wrap: wrap;
    }


    .books-search {

      position: relative;

      width: 100%;

      max-width: 520px;
    }


    .books-search input {

      width: 100%;

      box-sizing: border-box;

      padding:
        15px 48px 15px 18px;

      border:
        1px solid #d8d0c4;

      border-radius: 8px;

      background: #fff;

      color: #222;

      font-size: 15px;

      outline: none;

      transition:
        border-color .2s,
        box-shadow .2s;
    }


    .books-search input:focus {

      border-color:
        var(--books-gold);

      box-shadow:
        0 0 0 3px
        rgba(184, 137, 61, .12);
    }


    .books-search-icon {

      position: absolute;

      right: 17px;

      top: 50%;

      transform:
        translateY(-50%);

      pointer-events: none;

      font-size: 18px;
    }


    .clear-search {

      display: none;

      margin-top: 8px;

      border: none;

      background: transparent;

      color:
        var(--books-gold);

      cursor: pointer;

      font-size: 13px;

      padding: 0;
    }


    .clear-search.visible {
      display: inline-block;
    }


    .books-result-count {

      color: #777;

      font-size: 14px;
    }


    /* =========================
       MAIN CONTENT
    ========================= */

    .books-intro {
      margin-bottom: 30px;
    }


    .books-main {

      padding:
        30px 20px 60px;
    }


    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 900px) {

      .books-mobile-header {
        display: none !important;
      }


      .mobile-categories {
        display: none !important;
      }


      .books-sidebar {

        transform:
          translateX(0);
      }


      .books-main {

        margin-left: 260px;

        padding:
          40px 40px 80px;
      }


      .books-overlay {
        display: none !important;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 899px) {

      .books-mobile-header {
        display: flex;
      }


      .mobile-categories {
        display: block;
      }


      /* Hide categories inside the sidebar on mobile
         so they only appear in the horizontal strip */
      .books-sidebar .categories-section {
        display: none;
      }


      .books-toolbar {

        align-items:
          stretch;
      }


      .books-search {

        max-width: none;
      }

    }


    @media (max-width: 600px) {

      .books-toolbar {

        flex-direction:
          column;

        align-items:
          stretch;

        gap: 14px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       MOBILE OVERLAY
  ========================= -->

  <div
    class="books-overlay"
    id="booksOverlay"
    onclick="closeBooksMenu()"
  ></div>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav class="navbar">

    <div class="container nav-inner">

      <a
        class="logo"
        href="home.html"
      >

        <span class="logo-mark">
          S
        </span>

        <span class="logo-text">

          <h2>Santiano</h2>

          <small>
            BOOKS
          </small>

        </span>

      </a>


      <div class="nav-links">

        <a href="home.html">
          Home
        </a>

        <a
          class="active"
          href="books.html"
        >
          Books
        </a>

        <a href="library.html">
          My Library
        </a>

      </div>


      <div class="nav-actions">

        <a
          class="icon-btn"
          href="cart.html"
          aria-label="Shopping cart"
        >
          🛒
          <sup data-cart-count>
            0
          </sup>
        </a>

        <a
          class="account-btn"
          href="account.html"
        >
          My account
        </a>

      </div>

    </div>

  </nav>


  <!-- =========================
       MOBILE HEADER
  ========================= -->

  <header
    class="books-mobile-header"
  >

    <button
      class="books-hamburger"
      id="booksHamburger"
      type="button"
      onclick="toggleBooksMenu()"
      aria-label="Open menu"
      aria-expanded="false"
    >
      ☰
    </button>


    <h1 id="booksMobileTitle">
      All Books
    </h1>

  </header>


  <!-- =========================
       MOBILE CATEGORIES (horizontal)
  ========================= -->

  <div
    class="mobile-categories"
    id="mobileCategories"
    aria-label="Book categories"
  >

    <div class="mobile-categories-inner">

      <span class="mobile-categories-label">
        Categories
      </span>

      <div id="mobileCategoriesList">
        <div class="categories-loading">
          Loading...
        </div>
      </div>

    </div>

  </div>


  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside
    class="books-sidebar"
    id="booksSidebar"
  >

    <b class="books-sidebar-title">
      MENU
    </b>


    <a href="home.html">
      <span>⌂</span>
      <span>Home</span>
    </a>


    <a
      class="active"
      href="books.html"
    >
      <span>▤</span>
      <span>Books</span>
    </a>


    <a href="library.html">
      <span>▦</span>
      <span>My Library</span>
    </a>


    <a href="account.html">
      <span>♙</span>
      <span>My Account</span>
    </a>


    <a href="cart.html">
      <span>🛒</span>
      <span>Cart</span>
    </a>


    <a
      href="#"
      class="books-sidebar-logout"
      id="sidebarLogout"
    >
      <span>↪</span>
      <span>Logout</span>
    </a>


    <!-- =========================
         DYNAMIC CATEGORIES
         (desktop / sidebar only)
    ========================= -->

    <div class="categories-section">

      <b class="books-sidebar-title">
        CATEGORIES
      </b>


      <div
        id="categoriesList"
      >

        <div
          class="categories-loading"
        >
          Loading categories...
        </div>

      </div>

    </div>

  </aside>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="page">

    <div
      class="container books-main"
    >

      <div class="eyebrow">
        Digital Collection
      </div>


      <h1 class="page-title">
        All Books
      </h1>


      <p class="muted books-intro">
        Explore digital books written
        to inspire, educate and transform.
      </p>


      <!-- =========================
           SEARCH TOOLBAR
      ========================= -->

      <div class="books-toolbar">

        <div class="books-search">

          <input
            type="search"
            id="book-search"
            placeholder="Search books, authors or categories..."
            autocomplete="off"
            aria-label="Search books"
          >


          <span
            class="books-search-icon"
          >
            ⌕
          </span>


          <button
            type="button"
            id="clear-search"
            class="clear-search"
          >
            Clear search
          </button>

        </div>


        <div
          class="books-result-count"
          data-books-result-count
        ></div>

      </div>


      <!-- =========================
           BOOK GRID
      ========================= -->

      <section>

        <div
          class="books-grid"
          data-books-grid
        ></div>

      </section>

    </div>

  </main>


  <!-- =========================
       SCRIPTS
  ========================= -->

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>


  <script>

    const sidebar =
      document.getElementById(
        "booksSidebar"
      );

    const overlay =
      document.getElementById(
        "booksOverlay"
      );

    const hamburger =
      document.getElementById(
        "booksHamburger"
      );


    function toggleBooksMenu() {

      const isOpen =
        sidebar.classList.toggle(
          "open"
        );

      overlay.classList.toggle(
        "show",
        isOpen
      );

      hamburger.setAttribute(
        "aria-expanded",
        String(isOpen)
      );
    }


    function closeBooksMenu() {

      sidebar.classList.remove(
        "open"
      );

      overlay.classList.remove(
        "show"
      );

      hamburger.setAttribute(
        "aria-expanded",
        "false"
      );
    }


    /*
     * Close the mobile sidebar
     * when normal navigation links
     * are clicked.
     *
     * Category links are generated
     * dynamically by app.js, so
     * event delegation is used here.
     */

    sidebar.addEventListener(
      "click",
      event => {

        const link =
          event.target.closest(
            "a"
          );

        if (!link) {
          return;
        }


        if (
          window.innerWidth < 900
        ) {

          closeBooksMenu();

        }

      }
    );


    /*
     * Logout.
     */

    document
      .getElementById(
        "sidebarLogout"
      )
      .addEventListener(
        "click",
        event => {

          event.preventDefault();

          if (
            typeof logout ===
            "function"
          ) {

            logout();

          }

        }
      );


    /*
     * Escape key closes the
     * mobile sidebar.
     */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeBooksMenu();

        }

      }
    );


    /*
     * Mirror categories from the
     * sidebar list (#categoriesList)
     * into the mobile horizontal strip
     * so app.js only needs to fill one
     * container.
     *
     * Mobile clicks call the same filter
     * logic as app.js (filterBooks) and
     * keep the active state in sync on
     * both lists.
     */
    (function syncMobileCategories() {

      const source =
        document.getElementById(
          "categoriesList"
        );

      const target =
        document.getElementById(
          "mobileCategoriesList"
        );

      if (!source || !target) {
        return;
      }


      function copyCategories() {

        /* Clone all children so links
           and classes (incl. .active)
           stay in sync */
        target.innerHTML = "";

        Array.from(source.children)
          .forEach(child => {

            const clone =
              child.cloneNode(true);

            /* Clones must not keep the
               "already bound" flag from
               setupCategories, otherwise
               app.js skips them if it
               re-runs setupCategories. */
            if (clone.nodeType === 1) {
              clone.removeAttribute(
                "data-category-bound"
              );
              clone
                .querySelectorAll(
                  "[data-category-bound]"
                )
                .forEach(el => {
                  el.removeAttribute(
                    "data-category-bound"
                  );
                });
            }

            target.appendChild(clone);

          });
      }


      /* Initial copy (covers already-
         loaded content or loading state) */
      copyCategories();


      /* Watch for app.js updates
         (new categories + active class) */
      const observer =
        new MutationObserver(
          copyCategories
        );

      observer.observe(source, {
        childList: true,
        subtree: true,
        characterData: true,
        attributes: true,
        attributeFilter: ["class"]
      });


      /*
       * Mobile category tap:
       * 1. mark active on every
       *    [data-category] link
       * 2. update mobile title
       * 3. call filterBooks (from app.js)
       */
      target.addEventListener(
        "click",
        event => {

          const mobileLink =
            event.target.closest("a");

          if (!mobileLink) return;

          event.preventDefault();
          event.stopPropagation();

          const category =
            mobileLink.getAttribute(
              "data-category"
            );

          if (!category) return;


          /* Active state on all category links */
          document
            .querySelectorAll(
              "[data-category]"
            )
            .forEach(item => {
              item.classList.remove(
                "active"
              );
            });

          mobileLink.classList.add(
            "active"
          );

          /* Also mark the sidebar original */
          const original =
            source.querySelector(
              '[data-category="' +
              category
                .replace(/\\/g, "\\\\")
                .replace(/"/g, '\\"') +
              '"]'
            );

          if (original) {
            original.classList.add(
              "active"
            );
          }


          /* Mobile header title */
          const mobileTitle =
            document.getElementById(
              "booksMobileTitle"
            );

          if (mobileTitle) {
            mobileTitle.textContent =
              category === "All"
                ? "All Books"
                : category;
          }


          /* Filter the book grid (app.js) */
          if (
            typeof filterBooks ===
            "function"
          ) {
            filterBooks(category);
          }

        }
      );

    })();

  </script>

</body>

</html>
