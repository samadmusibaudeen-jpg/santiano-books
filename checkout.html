<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkout — ENT Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fb;--surface:#fff;--ink:#0b1324;--muted:#5d6678;--line:#e1e5ec;--brand:#12295c;--brand-ink:#fff;--accent:#a9792b;--soft:#f0f3f9;--nav-bg:rgba(255,255,255,.92);--grid:rgba(18,41,92,.06);--danger:#b42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1c;--surface:#111827;--ink:#eef1f7;--muted:#9aa3b5;--line:#1f2a3d;--brand:#8aa4ff;--brand-ink:#0a0f1c;--accent:#d9b068;--soft:#0f1729;--nav-bg:rgba(10,15,28,.92);--grid:rgba(138,164,255,.07);--danger:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1c;--surface:#111827;--ink:#eef1f7;--muted:#9aa3b5;--line:#1f2a3d;--brand:#8aa4ff;--brand-ink:#0a0f1c;--accent:#d9b068;--soft:#0f1729;--nav-bg:rgba(10,15,28,.92);--grid:rgba(138,164,255,.07);--danger:#f97066;color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:16px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--nav-bg);backdrop-filter:blur(12px)}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.container{width:min(1120px,90%);margin-inline:auto}
.muted{color:var(--muted)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.gold-btn,.outline-btn,.dark-btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 24px;border-radius:8px;border:1px solid transparent;font:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
.gold-btn,.dark-btn{background:var(--brand);color:var(--brand-ink)}
.gold-btn:hover,.dark-btn:hover{filter:brightness(1.12)}
.outline-btn{border-color:var(--line);background:var(--surface);color:var(--ink)}
.outline-btn:hover{border-color:var(--brand)}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* navbar */
.navbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{height:68px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.logo-mark{width:32px;height:32px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);border-radius:7px;font-size:17px}
.nav-links{display:flex;gap:32px}
.nav-links a{font-size:14px;color:var(--muted);transition:.2s}
.nav-links a:hover{color:var(--ink)}
.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:14px}
.icon-btn:hover{border-color:var(--brand)}
sup[data-cart-count]{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:600;line-height:1;vertical-align:baseline;top:0}
/* page */
.page{min-height:calc(100vh - 68px);background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px}
.page>.container{padding:56px 0 96px}
.page-title{margin:14px 0 32px;font-size:clamp(30px,3.8vw,42px)}
/* checkout content (rendered by js/checkout.js) */
.checkout-layout{display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px;max-width:860px;padding:32px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,20,50,.05)}
.checkout-layout>*{min-width:0}
.checkout-layout>div{flex:1 1 280px}
.checkout-layout h2,.checkout-layout h3{margin-bottom:10px}
.checkout-layout h2{font-size:26px}
.checkout-layout h3{font-size:20px}
.checkout-layout p{color:var(--muted);margin-top:8px}
.checkout-layout b,.checkout-layout strong{color:var(--ink);font-weight:600}
.checkout-layout hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.checkout-layout input,.checkout-layout select{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.checkout-layout input:focus,.checkout-layout select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.checkout-layout button{min-height:48px;margin-top:18px;padding:0 26px;border:0;border-radius:8px;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:.2s}
.checkout-layout button:hover{filter:brightness(1.12)}
.checkout-layout button:disabled{opacity:.6;cursor:default}
/* book cover */
.checkout-layout img{width:110px;max-width:100%;height:auto;object-fit:contain;border-radius:6px;box-shadow:0 12px 28px rgba(10,20,50,.2)}
@media (min-width:768px){.checkout-layout img{width:150px;max-width:150px}}
@media (max-width:700px){.nav-links{display:none}.page>.container{padding:36px 0 72px}.checkout-layout{padding:22px;gap:22px}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="cart" viewBox="0 0 24 24"><path d="M3 4h2l2.5 11h10l2-8H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></symbol>
</svg>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container nav-inner">
    <a class="logo" href="index.html"><span class="logo-mark">E</span><span class="logo-text">ENT Books</span></a>
    <div class="nav-links">
      <a href="books.html">Books</a>
      <a href="library.html">My Library</a>
    </div>
    <div class="nav-actions">
      <a class="icon-btn" href="cart.html" aria-label="Shopping cart"><svg class="i"><use href="#cart"/></svg><sup data-cart-count>0</sup></a>
    </div>
  </div>
</nav>

<!-- CHECKOUT -->
<main class="page">
  <div class="container">
    <div class="eyebrow">Secure Checkout</div>
    <h1 class="page-title">Complete Your Purchase</h1>

    <div class="checkout-layout" data-checkout>
      <p class="muted">Loading checkout...</p>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
